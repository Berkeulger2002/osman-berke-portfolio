name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Staging'de doğrulanan full commit SHA"
        required: true
        type: string

jobs:
  deploy:
    name: Promote to Production
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "${{ secrets.HETZNER_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Promote tested image to production
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$USER@$HOST" \
            "COMMIT_SHA='$COMMIT_SHA' bash -s" <<'REMOTE'
          set -e

          docker image inspect "osman-berke-portfolio:$COMMIT_SHA" > /dev/null

          docker tag \
            "osman-berke-portfolio:$COMMIT_SHA" \
            osman-berke-portfolio:production

          docker rm -f osman-berke-portfolio-production 2>/dev/null || true

          docker run -d \
            --name osman-berke-portfolio-production \
            -p 127.0.0.1:8082:8080 \
            --restart unless-stopped \
            osman-berke-portfolio:production

          sleep 8

          curl --fail --silent 127.0.0.1:8082 > /dev/null

          echo "Production deployment successful: $COMMIT_SHA"
          REMOTE
