name: Deploy Staging

on:
  workflow_run:
    workflows:
      - Portfolio CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "${{ secrets.HETZNER_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy tested commit to staging
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$USER@$HOST" "
              set -e
              cd /opt/osman-berke-portfolio
              git fetch origin
              git checkout -f '$COMMIT_SHA'
              docker build -t 'osman-berke-portfolio:$COMMIT_SHA' .
              docker rm -f osman-berke-portfolio-staging 2>/dev/null || true
              docker run -d --name osman-berke-portfolio-staging -p 127.0.0.1:8081:8080 --restart unless-stopped 'osman-berke-portfolio:$COMMIT_SHA'
              sleep 8
              curl --fail --silent 127.0.0.1:8081 > /dev/null
              docker tag 'osman-berke-portfolio:$COMMIT_SHA' osman-berke-portfolio:staging
              echo 'Staging deployment successful: $COMMIT_SHA'
            "
